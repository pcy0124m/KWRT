name: Build Kwrt for JDCloud RE-SP-01B-25.12
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx /usr/local/share/chromium /usr/local/share/powershell
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h /

    - name: Add swap (prevent OOM)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves python3-pyelftools libpython3-dev aria2 jq qemu-utils rename libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libmpfr-dev libncursesw5-dev libreadline-dev libtool lrzsz nano python3-pexpect python3-yaml subversion texinfo upx-ucl
        sudo rm -rf /etc/apt/sources.list.d/*

    - name: Clone OpenWrt source (Kwrt base = openwrt-25.12)
      run: |
        git clone --depth 1 https://github.com/openwrt/openwrt -b openwrt-25.12 openwrt
        cd openwrt
        git submodule update --init --recursive || true

    - name: Apply Kwrt diy (adds op-packages feed + patches)
      run: |
        cp $GITHUB_WORKSPACE/diy-1.sh openwrt/
        cd openwrt
        bash diy-1.sh

    - name: Remove op-packages feed (recursive dep bugs break kconfig)
      run: |
        cd openwrt
        # op-packages 库大量自依赖/循环依赖 bug 会导致 kconfig 崩溃丢弃目标配置
        # 整个移除, iStore 刷完后手动安装
        rm -rf feeds/op-packages package/feeds/op-packages
        sed -i '/op-packages/d' feeds.conf.default
        cat feeds.conf.default
        echo "=== 重新安装 feeds ==="
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "done"

    - name: Apply config
      run: |
        cd openwrt
        cp $GITHUB_WORKSPACE/config/Kwrt-jdcloud-re-sp-01b.config .config
        set +e
        make defconfig
        set -e
        echo "=== TARGET 行 ==="
        grep -E "^CONFIG_TARGET" .config | head -20 || echo "(无)"
        echo "=== 设备校验 ==="
        if grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" .config; then
          echo "设备已选中"
        else
          echo "!!! 设备未选中, 搜索可用设备 ==="
          grep -i "jdcloud\|re-sp" .config || echo "(无 jdcloud 符号)"
          grep "CONFIG_TARGET_.*_DEVICE_" .config | head -10 || echo "(无设备符号)"
          exit 1
        fi

    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;
        df -h /

    - name: Compile
      id: compile
      run: |
        cd openwrt
        echo "=== 编译前资源 ==="
        free -h; df -h /
        set +e
        # 并行编译, 不用 V=s (避免日志过大撑爆磁盘)
        make -j$(nproc) 2>&1 | tee build.log
        rc=${PIPESTATUS[0]}
        set -e
        echo "status=$rc" >> $GITHUB_OUTPUT
        echo "=== 错误摘要 ==="
        grep -iE "error:|Error [0-9]|failed|too big|too large|exceeds|No rule to make|Killed|OOM" build.log | tail -60 || echo "未找到明显错误"
        echo "=== 编译日志末尾 100 行 ==="
        tail -100 build.log
        echo "=== 固件检查 ==="
        find bin/targets -name "*.bin" -exec ls -lh {} \; 2>/dev/null || echo "!!! 未生成 .bin 固件 !!!"
        exit $rc

    - name: Upload build.log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: openwrt/build.log

    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == '0'
      run: |
        cd openwrt
        FIRMWARE_DIR="bin/targets/ramips/mt7621"
        if [ -d "$FIRMWARE_DIR" ] && [ -n "$(find $FIRMWARE_DIR -name '*.bin' 2>/dev/null | head -1)" ]; then
          echo "固件目录: $PWD/$FIRMWARE_DIR"
          ls -lh $FIRMWARE_DIR
          echo "FIRMWARE_PATH=$PWD/$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "!!! 固件目录为空或不存在 !!!"
          ls -la $FIRMWARE_DIR 2>/dev/null || true
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: kwrt-jdcloud-re-sp-01b
        path: ${{ env.FIRMWARE_PATH }}/

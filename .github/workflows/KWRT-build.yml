name: Build Kwrt for JDCloud RE-SP-01B-25.12
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx /usr/local/share/chromium /usr/local/share/powershell
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h /
    - name: Add swap (prevent OOM)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves python3-pyelftools libpython3-dev aria2 jq qemu-utils rename libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libmpfr-dev libncursesw5-dev libreadline-dev libtool lrzsz nano python3-pexpect python3-yaml subversion texinfo upx-ucl
        sudo rm -rf /etc/apt/sources.list.d/*
    - name: Clone OpenWrt source (Kwrt base = openwrt-25.12)
      run: |
        git clone --depth 1 https://github.com/openwrt/openwrt -b openwrt-25.12 openwrt
        cd openwrt
        git submodule update --init --recursive || true
    - name: Add op-packages feed (iStore) + remove broken packages
      run: |
        cd openwrt
        echo "src-git kiddin9 https://github.com/kiddin9/op-packages.git" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        for pkg in luci-app-ssr-plus luci-app-passwall snmpd-ssl quectel-cm torbp strongswan shadowsocksr-libev xray-core v2ray-core luci-app-vssr luci-app-openclash; do
          if [ -d "package/feeds/kiddin9/$pkg" ]; then
            rm -rf "package/feeds/kiddin9/$pkg"
            echo "removed: $pkg"
          fi
        done
        ls feeds/
    - name: Apply config
      run: |
        cd openwrt
        cp $GITHUB_WORKSPACE/config/Kwrt-jdcloud-re-sp-01b.config .config
        set +e
        make defconfig 2>&1 | tee defconfig.log
        set -e
        cp .config config-after-defconfig.txt
        grep -E "^CONFIG_TARGET" .config | head -20
        if grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" .config; then
          echo "device selected"
        else
          echo "device NOT selected"
          exit 1
        fi
    - name: Upload config diagnostic on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: kwrt-config-diagnostic
        path: |
          openwrt/config-after-defconfig.txt
          openwrt/defconfig.log
    - name: Download packages
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;
        df -h /
    - name: Compile
      id: compile
      run: |
        cd openwrt
        set +e
        make -j$(nproc) 2>&1 | tee build.log
        rc=${PIPESTATUS[0]}
        if [ "$rc" != "0" ]; then
          make -j1 V=s target/linux/compile 2>&1 | tail -150
        fi
        set -e
        echo "status=$rc" >> $GITHUB_OUTPUT
        find bin/targets -name "*.bin" -exec ls -lh {} \; 2>/dev/null || echo "no bin"
        exit $rc
    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == '0'
      run: |
        cd openwrt
        FIRMWARE_DIR="bin/targets/ramips/mt7621"
        if [ -d "$FIRMWARE_DIR" ] && [ -n "$(find $FIRMWARE_DIR -name '*.bin' 2>/dev/null | head -1)" ]; then
          ls -lh $FIRMWARE_DIR
          echo "FIRMWARE_PATH=$PWD/$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "firmware dir empty"
          echo "status=failed" >> $GITHUB_OUTPUT
        fi
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: kwrt-jdcloud-re-sp-01b
        path: ${{ env.FIRMWARE_PATH }}/

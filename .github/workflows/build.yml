name: Build Kwrt for JDCloud RE-SP-01B

on: workflow_dispatch

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  DIY_SH: diy.sh
  FREE_UP_DISK: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext git gcc-multilib g++-multilib gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano python3 python3-pip python3-pexpect python3-yaml rsync sphinx-doc subversion swig texinfo uglifyjs upx-ucl unzip wget zlib1g-dev
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git submodule update --init --recursive

    - name: Apply patches
      run: |
        cp $GITHUB_WORKSPACE/diy.sh openwrt/
        cd openwrt
        bash diy.sh

    - name: Download feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply config
      run: |
        cd openwrt
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile
      id: compile
      run: |
        cd openwrt
        # 删除所有 stamp 文件，强制重新编译
        find staging_dir -name ".stamp_*" -delete 2>/dev/null || true
        # 单线程详细编译，完整日志保存到文件
        make -j1 V=s 2>&1 | tee build.log
        # 搜索错误关键词
        echo "=== 搜索错误 ==="
        grep -i "error\|failed\|too big\|too large\|exceeds\|image.*not" build.log | tail -50 || echo "未找到明显错误"
        echo "=== 固件文件检查 ==="
        find bin/targets -name "*.bin" -o -name "*.gz" 2>/dev/null | head -20
        ls -la bin/targets/*/*/ 2>/dev/null | head -20
        echo "status=$?" >> $GITHUB_OUTPUT

    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == '0'
      run: |
        cd openwrt
        echo "=== 查找固件文件 ==="
        find bin/targets -name "*.bin" -exec ls -lh {} \; 2>/dev/null || echo "未找到 .bin 文件"
        ls -la bin/targets/*/*/ 2>/dev/null || echo "bin/targets/ 目录不存在"
        FIRMWARE_DIR=$(find bin/targets -type d -name "mt7621" -o -type d -name "*jdcloud*" 2>/dev/null | head -1)
        if [ -z "$FIRMWARE_DIR" ]; then
          FIRMWARE_DIR=$(find bin/targets -maxdepth 3 -type d 2>/dev/null | head -1)
        fi
        echo "固件目录: $FIRMWARE_DIR"
        if [ -n "$FIRMWARE_DIR" ] && [ -d "$FIRMWARE_DIR" ]; then
          echo "FIRMWARE_PATH=$PWD/$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: kwrt-jdcloud-re-sp-01b
        path: ${{ env.FIRMWARE_PATH }}/
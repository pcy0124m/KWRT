name: Build LEDE for JDCloud RE-SP-01B
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  DIY_SH: diy.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/pipx /usr/local/share/chromium /usr/local/share/powershell
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        df -h /

    - name: Add swap (prevent OOM)
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1M count=6144 status=progress
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext git gcc-multilib g++-multilib gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano python3 python3-pip python3-pexpect python3-yaml rsync subversion swig texinfo uglifyjs upx-ucl unzip wget zlib1g-dev
        sudo rm -rf /etc/apt/sources.list.d/*

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git submodule update --init --recursive

    - name: Apply patches
      run: |
        cp $GITHUB_WORKSPACE/$DIY_SH openwrt/
        cd openwrt
        bash $DIY_SH
        # 移除与内核 5.10.268 冲突的补丁 (gpio-ralink 已在内核中)
        rm -f target/linux/ramips/patches-5.10/802-GPIO-MIPS-ralink-add-gpio-driver-for-ralink-SoC.patch
        echo "patched, removed conflicting 802 patch"

    - name: Download feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply config
      run: |
        cd openwrt
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig
        echo "=== 校验设备 ==="
        grep "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" .config || { echo "!!! 设备未选中 !!!"; exit 1; }

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;
        df -h /

    - name: Compile
      id: compile
      run: |
        cd openwrt
        echo "=== 编译前资源 ==="
        free -h; df -h /
        set +e
        make -j$(nproc) 2>&1 | tee build.log
        rc=${PIPESTATUS[0]}
        if [ "$rc" != "0" ]; then
          echo "=== 编译失败, 单独重编内核查看错误 (V=s) ==="
          make -j1 V=s target/linux/compile 2>&1 | tee kernel-error.log | tail -150
        fi
        set -e
        echo "status=$rc" >> $GITHUB_OUTPUT
        echo "=== 错误摘要 ==="
        grep -iE "error:|Error [0-9]|failed|too big|too large|exceeds|No rule to make|Killed" build.log | tail -60 || echo "未找到明显错误"
        echo "=== 固件检查 ==="
        find bin/targets -name "*.bin" -exec ls -lh {} \; 2>/dev/null || echo "!!! 未生成 .bin 固件 !!!"
        exit $rc

    - name: Upload build.log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: lede-build-log
        path: |
          openwrt/build.log
          openwrt/kernel-error.log

    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == '0'
      run: |
        cd openwrt
        FIRMWARE_DIR="bin/targets/ramips/mt7621"
        if [ -d "$FIRMWARE_DIR" ] && [ -n "$(find $FIRMWARE_DIR -name '*.bin' 2>/dev/null | head -1)" ]; then
          echo "固件目录: $PWD/$FIRMWARE_DIR"
          ls -lh $FIRMWARE_DIR
          echo "FIRMWARE_PATH=$PWD/$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "!!! 固件目录为空或不存在 !!!"
          ls -la $FIRMWARE_DIR 2>/dev/null || true
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: lede-jdcloud-re-sp-01b
        path: ${{ env.FIRMWARE_PATH }}/

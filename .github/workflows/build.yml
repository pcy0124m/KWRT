name: Build‑Kwrt‑RE‑SP‑01B

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: "开启SSH调试tmate true/false"
        default: 'false'
        required: false
        type: string
  schedule:
    - cron: '0 17 * * *'

env:
  REPO_URL: https://github.com/kiddin9/Kwrt
  REPO_BRANCH: master
  CONFIG_FILE: configs/re-sp-01b.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get -qq update
          sudo apt-get -qq install $(curl -fsSL https://github.com/281677160/Actions-OpenWrt/raw/main/depends-ubuntu-2204)
          sudo apt-get -qq autoremove --purge
          sudo timedatectl set-timezone $TZ
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone Kwrt Source
        working-directory: /workdir
        run: |
          set +e
          for i in 1 2 3
          do
            git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
            if [ $? -eq 0 ];then
              break
            fi
            echo "git clone失败，第 $i 次重试，等待10秒..."
            rm -rf openwrt
            sleep 10
          done
          set -e
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Run diy‑part1 feeds
        run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load config & diy‑part2
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          make defconfig
          echo "==== 当前目标设备 ===="
          grep CONFIG_TARGET_DEVICE openwrt/.config

      - name: Open SSH debug(tmate)
        if: inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: Download source
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "BUILD_DATE=_$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV

      - name: Organize firmware
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传构件
        使用: actions/upload-artifact@v4
如果: steps.organize.outputs.status == 'success'
使用:
          名称: Kwrt‑RE‑SP‑01B${{ env.BUILD_DATE }}
: ${ env.FIRMWARE_PATH }}

      - 名称: 发布标签
id: rlease_tag
如果: env.UPLOAD_RELEASE == 'true'
        运行: |
          echo "tag=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT

      - 名称: 上传至 GitHub 发布版
        使用: softprops/action-gh-release@v1
        如果: steps.release_tag.outputs.tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          文件: ${{ env.FIRMWARE_PATH }}/*
          生成发布说明: 真


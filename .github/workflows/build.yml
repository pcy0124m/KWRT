name: Build Kwrt for JDCloud RE-SP-01B

on: workflow_dispatch

permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  CONFIG_FILE: config/jdcloud-re-sp-01b.config
  DIY_SH: diy.sh
  FREE_UP_DISK: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install ack antlr3 asciidoc autoconf automake autopoint bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext git gcc-multilib g++-multilib gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano python3 python3-pip python3-pexpect python3-yaml rsync sphinx-doc subversion swig texinfo uglifyjs upx-ucl unzip wget zlib1g-dev
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        git submodule update --init --recursive

    - name: Apply patches
      run: |
        cp $GITHUB_WORKSPACE/diy.sh openwrt/
        cd openwrt
        bash diy.sh

    - name: Download feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply config
      run: |
        cd openwrt
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -la {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) && echo "status=0" >> $GITHUB_OUTPUT || {
          make -j1 && echo "status=0" >> $GITHUB_OUTPUT || {
            make -j1 V=s 2>&1 | tail -200
            echo "status=$?" >> $GITHUB_OUTPUT
          }
        }

    - name: Organize firmware
      id: organize
      if: steps.compile.outputs.status == '0'
      run: |
        cd openwrt
        # 查找固件目录
        FIRMWARE_DIR=$(find bin/targets -type d -name "mt7621" -o -type d -name "*jdcloud*" 2>/dev/null | head -1)
        if [ -z "$FIRMWARE_DIR" ]; then
          FIRMWARE_DIR=$(find bin/targets -type d -name "*" 2>/dev/null | head -1)
        fi
        echo "固件目录: $FIRMWARE_DIR"
        if [ -n "$FIRMWARE_DIR" ] && [ -d "$FIRMWARE_DIR" ]; then
          ls -la "$FIRMWARE_DIR/"
          echo "FIRMWARE_PATH=$PWD/$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "未找到固件文件！"
          find bin/targets -type f -name "*.bin" 2>/dev/null
          echo "status=failed" >> $GITHUB_OUTPUT
        fi

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: kwrt-jdcloud-re-sp-01b
        path: ${{ env.FIRMWARE_PATH }}/

    - name: Create Release Tag
      id: tag
      if: steps.organize.outputs.status == 'success'
      run: |
        echo "RELEASE_TAG=v$(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Kwrt 固件 ${{ env.RELEASE_TAG }}
        body: |
          ## Kwrt 固件 - 京东云 RE-SP-01B
          - 源码：coolsnowwolf/lede
          - 编译时间：${{ env.RELEASE_TAG }}
          - 默认 IP：192.168.12.1
          - 包含 iStore 软件中心、OpenAppFilter 应用过滤等
        files: ${{ env.FIRMWARE_PATH }}/*
        generate_release_notes: true
        make_latest: true